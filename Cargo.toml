[package]
name = "cmdrvl-tabular"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Deterministic shared tabular reader (CSV, TSV, JSONL, Parquet, XLSX) for CMD+RVL spine tools"
license = "MIT"
publish = false

[features]
default = ["zstd", "preserve-order"]
# Parquet zstd codec. Pulls a C dependency (zstd-sys); disable for pure-Rust builds.
zstd = ["parquet/zstd"]
# Turns on `serde_json/preserve_order` for the whole build, which also changes the
# key order of the consumer's own JSON. On by default so existing consumers keep
# what they had. This crate does not need it: disabling it changes no output here.
preserve-order = ["serde_json/preserve_order"]

[dependencies]
bytes = "1"
csv = "1.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
# JSON numbers are parsed from their original token and canonicalized exactly for
# the byte-oriented Cell/key API; core defaults stay disabled.
cmdrvl-core = { git = "https://github.com/cmdrvl/core", rev = "b586ad3", default-features = false }
calamine = "0.38"
# Same version calamine pulls in. Used only to measure XLSX decompressed size before calamine reads it.
zip = { version = "9.0", default-features = false, features = ["deflate"] }
# record API only: no `arrow` feature, so no arrow types in the public API.
parquet = { version = "60.2", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4", "brotli"] }

[dev-dependencies]
# Pinned: the conformance tests call only `spine_rules::composite_key`
# (`assert_ordered_tuple_semantics`, `reference_key_tuple`), unchanged since this rev.
spine-rules = { git = "https://github.com/cmdrvl/spine-rules", rev = "cd3192ca429ec5b195045d66f7ae3ecb83a45bb1" }
tempfile = "3"
