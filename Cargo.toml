[package]
name = "cmdrvl-tabular"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Deterministic shared tabular reader (CSV, TSV, JSONL, Parquet, XLSX) for CMD+RVL spine tools"
license = "MIT"
publish = false

[features]
default = ["zstd"]
# Parquet zstd codec. Pulls a C dependency (zstd-sys); disable for pure-Rust builds.
zstd = ["parquet/zstd"]

[dependencies]
csv = "1.4"
serde = { version = "1", features = ["derive"] }
# preserve_order: without it JSONL object keys come back sorted and headers stop
# matching the CSV/Parquet column order.
serde_json = { version = "1", features = ["preserve_order"] }
calamine = "0.38"
# record API only: no `arrow` feature, so no arrow types in the public API.
parquet = { version = "60.2", default-features = false, features = ["snap", "flate2-zlib-rs", "lz4"] }

[dev-dependencies]
# Local skeleton: sibling checkout. Switch to the git dependency once the repo decision is made.
spine-rules = { path = "../spine-rules" }
tempfile = "3"
